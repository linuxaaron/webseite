<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 385 255" role="img" aria-label="Weiße verspielte Katze mit blauem Wollknäuel">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7ebf0"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc5cb"/>
      <stop offset="1" stop-color="#f18f9d"/>
    </linearGradient>
    <radialGradient id="eye" cx="45%" cy="35%">
      <stop offset="0" stop-color="#8ee9ff"/>
      <stop offset="0.55" stop-color="#22b9ed"/>
      <stop offset="1" stop-color="#0879bd"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- tail -->
    <path d="M278 194 C329 205 347 175 330 143 C321 126 296 129 300 147 C304 164 320 165 328 153" fill="none" stroke="#eef1f4" stroke-width="25" stroke-linecap="round"/>
    <path d="M278 194 C329 205 347 175 330 143 C321 126 296 129 300 147 C304 164 320 165 328 153" fill="none" stroke="#d7dde3" stroke-width="2" stroke-linecap="round" opacity=".8"/>

    <!-- body -->
    <ellipse cx="218" cy="173" rx="74" ry="54" fill="url(#fur)" stroke="#d7dde3" stroke-width="2"/>
    <ellipse cx="259" cy="177" rx="35" ry="38" fill="#f7f8fa" stroke="#d7dde3" stroke-width="2"/>

    <!-- rear leg -->
    <ellipse cx="276" cy="207" rx="34" ry="18" fill="url(#fur)" stroke="#d7dde3" stroke-width="2"/>

    <!-- head -->
    <path d="M101 116 L111 44 Q114 27 128 40 L158 68 Q183 57 210 68 L242 39 Q256 28 259 47 L266 119 Q266 173 185 181 Q104 172 101 116Z" fill="url(#fur)" stroke="#d7dde3" stroke-width="2.5"/>

    <!-- ears -->
    <path d="M115 82 L121 48 Q123 42 129 48 L154 73 Q135 72 115 82Z" fill="url(#ear)"/>
    <path d="M244 72 L253 47 Q255 41 260 50 L260 84 Q251 77 244 72Z" fill="url(#ear)"/>

    <!-- forehead tuft -->
    <path d="M166 69 Q176 51 183 67 Q192 48 199 67 Q211 52 215 73" fill="none" stroke="#d7dde3" stroke-width="6" stroke-linecap="round"/>

    <!-- left eye -->
    <ellipse cx="145" cy="112" rx="20" ry="27" fill="url(#eye)" stroke="#253241" stroke-width="3"/>
    <ellipse cx="147" cy="113" rx="9" ry="18" fill="#07131f"/>
    <ellipse cx="139" cy="103" rx="5" ry="7" fill="#fff"/>
    <circle cx="152" cy="126" r="3" fill="#8ee9ff"/>

    <!-- wink -->
    <path d="M190 115 Q208 129 225 113" fill="none" stroke="#253241" stroke-width="5" stroke-linecap="round"/>

    <!-- brows -->
    <path d="M132 84 Q145 78 156 84" fill="none" stroke="#9aa4ad" stroke-width="4" stroke-linecap="round"/>
    <path d="M198 83 Q210 77 220 83" fill="none" stroke="#9aa4ad" stroke-width="4" stroke-linecap="round"/>

    <!-- muzzle -->
    <ellipse cx="183" cy="139" rx="34" ry="25" fill="#fff"/>
    <path d="M178 134 Q184 130 190 134 Q188 141 184 142 Q180 141 178 134Z" fill="#e77d8d" stroke="#b75b69" stroke-width="1"/>
    <path d="M184 141 Q184 151 173 151 M184 141 Q184 151 195 151" fill="none" stroke="#8c5660" stroke-width="2.5" stroke-linecap="round"/>

    <!-- whiskers -->
    <g stroke="#9ca7b1" stroke-width="2" stroke-linecap="round" opacity=".9">
      <path d="M153 141 L113 132"/><path d="M153 148 L110 148"/><path d="M153 154 L117 164"/>
      <path d="M214 141 L252 132"/><path d="M214 148 L256 148"/><path d="M214 154 L250 164"/>
    </g>

    <!-- front paws -->
    <ellipse cx="172" cy="194" rx="29" ry="18" fill="url(#fur)" stroke="#d7dde3" stroke-width="2"/>
    <ellipse cx="208" cy="198" rx="31" ry="18" fill="url(#fur)" stroke="#d7dde3" stroke-width="2"/>
    <path d="M165 194 Q172 187 178 194 M201 198 Q208 191 215 198" fill="none" stroke="#b6bec7" stroke-width="2" stroke-linecap="round"/>

    <!-- yarn ball -->
    <circle cx="78" cy="207" r="25" fill="#59cfff" stroke="#178dc4" stroke-width="2"/>
    <path d="M58 204 Q76 190 98 204 Q78 217 60 215 Q78 226 97 213 M59 198 Q78 212 98 197" fill="none" stroke="#d7f5ff" stroke-width="2" opacity=".9"/>
    <path d="M99 208 C126 216 136 205 151 208" fill="none" stroke="#55c8f7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- subtle sparkles -->
  <g fill="#55c8f7" opacity=".9">
    <path d="M47 91 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M285 76 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <circle cx="305" cy="101" r="3"/>
    <circle cx="91" cy="77" r="2.5"/>
  </g>
</svg>
